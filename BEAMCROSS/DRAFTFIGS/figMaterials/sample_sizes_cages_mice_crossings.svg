<rect id="run-390" x="346" y="146" width="88" height="40" rx="9" fill="#002bff"/>
<text x="390" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="white">161</text>
<text x="15" y="208" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" fill="#232323">Crossings are totals across D0, D7 and D14 (377 total).</text>
<text x="15" y="229" font-family="Arial, Helvetica, sans-serif" font-size="11" text-anchor="start" fill="#232323">Same mice across days; one runner has 2 rather than 3 D0 crossings.</text>
