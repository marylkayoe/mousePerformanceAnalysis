<svg xmlns="http://www.w3.org/2000/svg" width="470" height="245" viewBox="0 0 470 245">
<title>Balance-beam sample sizes across D0, D7 and D14</title>
<rect width="470" height="245" fill="white"/>
<text x="160" y="25" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#232323">Cages</text>
<text x="270" y="25" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#232323">Mice</text>
<text x="390" y="25" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="middle" fill="#232323">Crossings</text>
<text x="15" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" fill="#000000">SED</text>
<rect id="sedentary-160" x="116" y="42" width="88" height="40" rx="9" fill="#000000"/>
<text x="160" y="69" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="white">4</text>
<rect id="sedentary-270" x="226" y="42" width="88" height="40" rx="9" fill="#000000"/>
<text x="270" y="69" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="white">12</text>
<rect id="sedentary-390" x="346" y="42" width="88" height="40" rx="9" fill="#000000"/>
<text x="390" y="69" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="white">108</text>
<text x="15" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" fill="#00b226">WALK</text>
<rect id="walk-160" x="116" y="94" width="88" height="40" rx="9" fill="#00b226"/>
<text x="160" y="121" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="black">4</text>
<rect id="walk-270" x="226" y="94" width="88" height="40" rx="9" fill="#00b226"/>
<text x="270" y="121" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="black">12</text>
<rect id="walk-390" x="346" y="94" width="88" height="40" rx="9" fill="#00b226"/>
<text x="390" y="121" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="black">108</text>
<text x="15" y="174" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" fill="#002bff">RUN</text>
<rect id="run-160" x="116" y="146" width="88" height="40" rx="9" fill="#002bff"/>
<text x="160" y="173" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="white">7</text>
<rect id="run-270" x="226" y="146" width="88" height="40" rx="9" fill="#002bff"/>
